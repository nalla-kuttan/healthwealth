name: PRHeatmap
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PRHeatmap:
    type: application
    platform: iOS
    sources:
      - path: PRHeatmap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.PRHeatmap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PR Heatmap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  PRHeatmapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PRHeatmapTests
    dependencies:
      - target: PRHeatmap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PRHeatmap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PRHeatmap"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PRHeatmap:
    build:
      targets:
        PRHeatmap: all
        PRHeatmapTests: [test]
    test:
      targets:
        - PRHeatmapTests
